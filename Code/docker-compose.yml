services:
  server:
    build: ./Server
    container_name: caro-server
    environment:
      - RUNNING_IN_DOCKER=true
      # Keep the real-game defaults, but allow a short deadline when presenting
      # the disconnect integration demo (for example: ...=3 docker compose up).
      - CARO_TURN_TIME_LIMIT_SECONDS=${CARO_TURN_TIME_LIMIT_SECONDS:-30}
      - CARO_RECONNECT_GRACE_SECONDS=${CARO_RECONNECT_GRACE_SECONDS:-60}
    ports:
      - "8765:8765"
    env_file:
      - ./Server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - caro-network

  db:
    image: postgres:18
    container_name: caro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: caro_pass
      POSTGRES_DB: caro_db
    volumes:
      - pgdata:/var/lib/postgresql
      - ./Server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caro_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - caro-network

volumes:
  pgdata:

networks:
  caro-network:
    driver: bridge
